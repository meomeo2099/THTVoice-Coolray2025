name: Release candidate APK

# Manual only. Builds a release-signed APK, update.json and the voice pack. Fails closed when
# signing secrets or the pinned certificate are missing: a customer build is never signed with
# a CI debug key. With "publish" on (default, owner decision 30/09/2026) it also creates the
# GitHub Release that the license Worker serves as the OTA update and the voice download
# (docs/phase11/RELEASE_PLAN.md), so the update is live as soon as the run is green.

on:
  push:
    branches: [test/coolray2025-voice-20261111]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (empty = previous release + 1)'
        required: false
        type: string
      version_name:
        description: 'versionName, e.g. 1.0.1 (empty = 1.0.<versionCode-1>)'
        required: false
        type: string
      publish:
        description: 'Publish as the latest GitHub Release (OTA goes live for every car)'
        required: false
        default: true
        type: boolean
      force_update:
        description: 'Bắt buộc cập nhật: khi xe đỗ, trợ lý tạm dừng cho tới khi cài bản này'
        required: false
        default: false
        type: boolean
      changelog:
        description: 'What changed (shown in the update dialog)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout (with tags for the version gate)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick version and gate it
        shell: bash
        env:
          IN_CODE: ${{ inputs.version_code || '7' }}
          IN_NAME: ${{ inputs.version_name || '1.0.6' }}
        run: |
          set -euo pipefail
          read -r code name < <(bash scripts/release/next-version.sh "$IN_CODE" "$IN_NAME")
          bash scripts/release/check-version.sh "$code" "$name"
          echo "THTVOICE_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "THTVOICE_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "### THT Voice $name (versionCode $code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Require signing secrets (fail closed)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.THT_SIGN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.THT_SIGN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THT_SIGN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.THT_SIGN_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.THT_SIGN_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE_B64" ]] || missing+=(THT_SIGN_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(THT_SIGN_STORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(THT_SIGN_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(THT_SIGN_KEY_PASSWORD)
          [[ -n "$CERT_SHA256" ]] || missing+=(THT_SIGN_CERT_SHA256)
          if (( ${#missing[@]} )); then
            echo "::error title=Release signing not configured::Missing secrets: ${missing[*]} (see docs/phase11/RELEASE_PLAN.md)"
            exit 1
          fi
          keystore="$RUNNER_TEMP/thtvoice-release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          {
            echo "THTVOICE_KEYSTORE_FILE=$keystore"
            echo "THTVOICE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "THTVOICE_KEY_ALIAS=$KEY_ALIAS"
            echo "THTVOICE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "THTVOICE_RELEASE_CERT_SHA256=$CERT_SHA256"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 32 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-32" "build-tools;32.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Python for offline voice models
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage full-offline runtime and models
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-sherpa-android.sh
          bash scripts/fetch-gipformer65m-int8.sh
          bash scripts/fetch-sherpa-kws-heytht.sh
          THTVOICE_KOKORO_TTS_DIR=build/kokoro-full/kokoro_vi bash scripts/fetch-kokoro-vi-tts.sh
          # The voice is delivered as a separate pack (owner decision 29/09/2026).
          python3 scripts/split-kokoro-pack.py build/kokoro-full/kokoro_vi app/src/main/assets/models/tts/kokoro_vi release-output/voice-pack

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble signed release APK
        shell: bash
        run: |
          set -o pipefail
          if ! gradle :app:assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/assemble.log"; then
            # Surface the cause as annotations (readable without downloading the full log).
            { grep -A8 "First failure" "$RUNNER_TEMP/assemble.log" || true; grep -B2 -A12 "What went wrong" "$RUNNER_TEMP/assemble.log" || true; grep -E "Error: |\.kt:[0-9]+|\.xml:[0-9]+" "$RUNNER_TEMP/assemble.log" || true; } \
              | grep -v "^> Task" | grep -v "^\s*at " | head -45 | while IFS= read -r line; do echo "::error title=assembleRelease::${line}"; done
            exit 1
          fi

      - name: Verify signature, package and version
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          bash scripts/release/verify-release-apk.sh "$apk" "$THTVOICE_RELEASE_CERT_SHA256" "$THTVOICE_VERSION_CODE" "$THTVOICE_VERSION_NAME"
          echo "RELEASE_APK=$apk" >> "$GITHUB_ENV"

      - name: Create update.json, voice-pack.json and release info
        shell: bash
        env:
          CHANGELOG: ${{ inputs.changelog }}
          THTVOICE_FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          set -euo pipefail
          printf '%s' "$CHANGELOG" > "$RUNNER_TEMP/changelog.txt"
          bash scripts/release/create-update-json.sh "$RELEASE_APK" "$THTVOICE_VERSION_CODE" "$THTVOICE_VERSION_NAME" release-output "$RUNNER_TEMP/changelog.txt"
          python3 scripts/release/create-voice-pack-json.py app/src/main/assets/models/tts/kokoro_vi/PACK.txt release-output/voice-pack

      - name: Upload release candidate artifact
        # Bản phát hành nằm ở GitHub Release; kho artifact Actions đầy (giới hạn 2 GB) không được
        # chặn việc phát hành.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: THTVoice-rc-${{ env.THTVOICE_VERSION_NAME }}-${{ env.THTVOICE_VERSION_CODE }}
          path: |
            release-output/**
            !release-output/voice-pack/*.zip
          if-no-files-found: error
          # APK đã nằm ở GitHub Release; artifact chỉ để xem nhanh, giữ 1 ngày cho đỡ tốn lưu trữ.
          retention-days: 1

      - name: Publish GitHub Release (OTA; voice pack reused)
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The voice pack lives in its own release "voice-kokoro_vi-<sha12>" and only changes when the
          # voice sources change, so the app release carries just the APK (owner request 01/10/2026).
          rev="$(python3 -c "import json;print(json.load(open('release-output/voice-pack/voice-pack.json'))['sha256'][:12])")"
          voice_tag="voice-kokoro_vi-$rev"
          if gh release view "$voice_tag" >/dev/null 2>&1; then
            echo "Voice pack reused: $voice_tag" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$voice_tag" --target "$GITHUB_SHA" --latest=false \
              --title "Giọng đọc Ngọc Huyền / Diễm Trinh ($rev)" \
              --notes "Gói giọng đọc Kokoro tiếng Việt cho nút Tải về trong app. Không phải bản cập nhật app." \
              release-output/voice-pack/*.zip release-output/voice-pack/voice-pack.json
            echo "New voice pack published: $voice_tag" >> "$GITHUB_STEP_SUMMARY"
          fi
          tag="release-$THTVOICE_VERSION_NAME-$THTVOICE_VERSION_CODE"
          notes="$RUNNER_TEMP/notes.md"
          { echo "THT Voice $THTVOICE_VERSION_NAME (versionCode $THTVOICE_VERSION_CODE)"; echo; cat "$RUNNER_TEMP/changelog.txt"; echo; echo "Giọng đọc: $voice_tag"; echo; cat release-output/RELEASE_INFO.txt; } > "$notes"
          gh release create "$tag" --target "$GITHUB_SHA" --title "THT Voice $THTVOICE_VERSION_NAME" --notes-file "$notes" --latest \
            release-output/THTVoice-*.apk release-output/update.json release-output/SHA256.txt
          echo "Published $tag: cars see it at the next Kiểm tra cập nhật." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/thtvoice-release.jks"
